<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Birthday Display</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Amatic+SC:wght@700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;}

.screen{
  width:100vw;height:100vh;
  background:linear-gradient(160deg,#c5ddd0 0%,#b0cfc0 35%,#a8c8b8 65%,#b8d4c4 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

/* Marble/watercolor overlay blobs */
.blob1{position:absolute;top:-60px;right:100px;width:380px;height:280px;background:radial-gradient(ellipse,rgba(255,255,255,.38) 0%,transparent 70%);border-radius:60% 40% 55% 45%;transform:rotate(-15deg);pointer-events:none;}
.blob2{position:absolute;bottom:80px;left:60px;width:260px;height:200px;background:radial-gradient(ellipse,rgba(255,255,255,.22) 0%,transparent 70%);border-radius:40% 60% 45% 55%;pointer-events:none;}
.blob3{position:absolute;top:40%;right:5%;width:180px;height:180px;background:radial-gradient(ellipse,rgba(255,255,255,.18) 0%,transparent 70%);border-radius:50%;pointer-events:none;}

/* Gold paint splash — top right like template */
.paint-splash{
  position:absolute;top:10px;right:90px;
  width:300px;height:220px;
  background:radial-gradient(ellipse at 40% 40%,rgba(212,175,55,.55) 0%,rgba(220,190,80,.25) 40%,transparent 70%);
  border-radius:48% 52% 60% 40% / 45% 55% 45% 55%;
  transform:rotate(-10deg);pointer-events:none;z-index:1;
}
/* Secondary gold splash */
.paint-splash2{
  position:absolute;top:30px;right:140px;
  width:180px;height:140px;
  background:radial-gradient(ellipse at 60% 30%,rgba(240,210,80,.4) 0%,transparent 65%);
  border-radius:55% 45% 40% 60%;transform:rotate(5deg);
  pointer-events:none;z-index:1;
}

.balloon-layer,
#conf-layer{
  overflow:hidden;
}

/* Gold streamers / ribbons */
.streamer{position:absolute;pointer-events:none;z-index:1;}
@keyframes swayL{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(-3deg);}}
@keyframes swayR{0%,100%{transform:rotate(8deg);}50%{transform:rotate(3deg);}}


/* Gift boxes — bottom corners */
.gifts{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:0 160px;pointer-events:none;z-index:2;align-items:flex-end;}
.gift-wrap{display:flex;flex-direction:column;align-items:center;}
.gift-box{
  width:85px;height:75px;
  background:linear-gradient(175deg,#f0d060 0%,#c8960a 60%,#a87800 100%);
  border-radius:5px;position:relative;
  box-shadow:4px 6px 16px rgba(0,0,0,.25);
}
.gift-box::before{
  content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:14px;height:100%;
  background:rgba(255,255,255,.3);
}
.gift-lid{
  width:95px;height:20px;
  background:linear-gradient(90deg,#e8c840,#d4a800,#e8c840);
  border-radius:4px;margin-bottom:-2px;
  box-shadow:2px 3px 8px rgba(0,0,0,.2);
}
.gift-bow{
  width:50px;height:32px;position:relative;margin-bottom:-8px;
}
.gift-bow::before,.gift-bow::after{
  content:"";position:absolute;
  width:24px;height:20px;
  border-radius:50% 50% 0 0;
  background:linear-gradient(135deg,#f5d060,#b8860b);
  top:0;
}
.gift-bow::before{left:0;transform:rotate(-20deg);transform-origin:bottom right;}
.gift-bow::after{right:0;transform:rotate(20deg);transform-origin:bottom left;}

/* Main layout */
.main{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;}

/* Happy Birthday — Great Vibes script like template */
.hb-title{
  font-family:"Great Vibes",cursive;
  font-size:clamp(4.5rem,10vw,9rem);
  color:#1a4a2e;
  line-height:1;
  text-shadow:2px 3px 10px rgba(0,0,0,.12);
  margin-bottom:.4rem;
}

/* Date */
.date-label{
  font-family:"Montserrat",sans-serif;font-size:1rem;font-weight:600;
  color:#2d6a4a;letter-spacing:.2em;text-transform:uppercase;
  margin-bottom:.5rem;
}

/* Badge */
.badge{
  display:inline-block;margin-bottom:.7rem;
  background:#1a4a2e;color:#fff;
  font-family:"Montserrat",sans-serif;font-size:.9rem;font-weight:700;
  padding:.35rem 1.3rem;border-radius:999px;
}

/* Celebrants */
.celebrants{display:flex;flex-direction:row;justify-content:center;align-items:flex-start;width:75%;gap:0;transition:opacity .4s ease;}
.celebrants.solo{width:100%;}
.person{display:flex;flex-direction:column;align-items:center;gap:.8rem;animation:popin .5s ease both;width:50%;}
.celebrants.solo .person{width:auto;}
@keyframes popin{0%{transform:scale(.75);opacity:0;}80%{transform:scale(1.04);}100%{transform:scale(1);opacity:1;}}

/* Gold ring photo — exactly like template */
.avatar-wrap{
  width:420px;height:420px;border-radius:50%;
  padding:8px;
  background:conic-gradient(#f5d060,#c8960a,#f0d060,#b8860b,#f5d060);
  box-shadow:0 10px 40px rgba(0,0,0,.22),0 0 0 3px rgba(212,175,55,.3);
  flex-shrink:0;
}
.avatar{
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,#d4af37,#8b6914);
  display:flex;align-items:center;justify-content:center;
  font-family:"Amatic SC",cursive;font-weight:700;color:#fff;font-size:7rem;
}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}

/* BALLOONS */
.bal{
  position:absolute;
  bottom:-200px;
  border-radius:50%;
  opacity:.85;
  animation:floatUp linear infinite;
  z-index:1;
}

.bal::after{
  content:'';
  position:absolute;
  width:2px;
  height:80px;
  background:rgba(255,255,255,.5);
  left:50%;
  top:100%;
  transform:translateX(-50%);
}

.bal-shine{
  position:absolute;
  width:25%;
  height:25%;
  background:rgba(255,255,255,.5);
  border-radius:50%;
  top:15%;
  left:18%;
}

/* CONFETTI */
.conf{
  position:absolute;
  opacity:.9;
  animation:confettiFall linear infinite;
  z-index:2;
}

/* ANIMATIONS */
@keyframes floatUp{
  from{
    transform:translateY(0);
  }
  to{
    transform:translateY(-140vh);
  }
}

@keyframes confettiFall{
  from{
    transform:translateY(-100px) rotate(0deg);
  }
  to{
    transform:translateY(120vh) rotate(720deg);
  }
}



/* Name — bold Montserrat like template */
.pname{
  font-family:"Montserrat",sans-serif;font-weight:700;
  font-size:2.6rem;color:#1a4a2e;
  text-align:center;line-height:1.2;max-width:440px;
}

/* ESCO logo */
.logo-area{position:absolute;bottom:.8rem;left:50%;transform:translateX(-50%);z-index:4;}
.logo-area img{height:65px;width:auto;display:block;}

/* Slide nav */
.dots{position:absolute;bottom:.3rem;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:8px;}
.slide-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(26,74,46,.25);transition:all .3s ease;cursor:pointer;}
.slide-dot.active{background:#1a4a2e;transform:scale(1.35);}
.slide-counter{position:absolute;top:1rem;right:1.5rem;z-index:5;color:rgba(26,74,46,.4);font-size:.8rem;font-family:"Montserrat",sans-serif;}
.no-bday{color:#1a4a2e;font-size:1.5rem;font-family:"Montserrat",sans-serif;}
</style>
</head>

const PER_SLIDE=2,SLIDE_MS=6000;
const now=new Date(),todayM=now.getMonth()+1,todayD=now.getDate();
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
document.getElementById("date-label").textContent=MONTHS[now.getMonth()]+" "+todayD+", "+now.getFullYear();

/* BALLOONS */
const balloonLayer = document.getElementById("balloon-layer");

for(let i = 0; i < 25; i++){

  const b = document.createElement("div");
  b.className = "bal";

  const size = 40 + Math.random() * 70;

  b.style.width = size + "px";
  b.style.height = size * 1.2 + "px";

  b.style.left = Math.random() * 100 + "vw";

  b.style.animationDuration = (10 + Math.random() * 12) + "s";
  b.style.animationDelay = (-Math.random() * 20) + "s";

  const colors = [
    "#f4c542",
    "#ffd95a",
    "#f2b705",
    "#e6c14f",
    "#ffffff88"
  ];

  b.style.background =
    colors[Math.floor(Math.random() * colors.length)];

  const shine = document.createElement("div");
  shine.className = "bal-shine";

  b.appendChild(shine);
  balloonLayer.appendChild(b);
}


/* CONFETTI */
const confLayer = document.getElementById("conf-layer");

for(let i = 0; i < 120; i++){

  const c = document.createElement("div");
  c.className = "conf";

  const size = 4 + Math.random() * 8;

  c.style.width = size + "px";
  c.style.height = size * 1.8 + "px";

  c.style.left = Math.random() * 100 + "vw";

  c.style.top = (-Math.random() * 100) + "px";

  c.style.animationDuration = (6 + Math.random() * 8) + "s";
  c.style.animationDelay = (-Math.random() * 15) + "s";

  const colors = [
    "#f4c542",
    "#ffffff",
    "#ffd95a",
    "#e6c14f"
  ];

  c.style.background =
    colors[Math.floor(Math.random() * colors.length)];

  c.style.transform =
    `rotate(${Math.random() * 360}deg)`;

  confLayer.appendChild(c);
}

const celebrants=EMPLOYEES.filter(e=>e.month===todayM&&e.day===todayD);
function initials(n){return n.split(" ").map(w=>w[0]||"").slice(0,2).join("").toUpperCase();}

function makePerson(person){
  const wrap=document.createElement("div");wrap.className="person";
  const aw=document.createElement("div");aw.className="avatar-wrap";
  const av=document.createElement("div");av.className="avatar";
  if(person.photo&&person.photo.startsWith("http")){
    const img=document.createElement("img");img.src=person.photo;
    img.onerror=function(){av.textContent=initials(person.name);};
    av.appendChild(img);
  }else{av.textContent=initials(person.name);}
  aw.appendChild(av);wrap.appendChild(aw);
  const nm=document.createElement("div");nm.className="pname";nm.textContent=person.name;wrap.appendChild(nm);
  return wrap;
}

function buildSlide(persons){
  const g=document.getElementById("celebrants");g.innerHTML="";
  g.className=persons.length===1?"celebrants solo":"celebrants";
  persons.forEach(function(p,i){const el=makePerson(p);el.style.animationDelay=(i*.15).toFixed(2)+"s";g.appendChild(el);});
}

let timer=null,cur=0,slides=[];
function goTo(idx){
  cur=(idx+slides.length)%slides.length;
  const g=document.getElementById("celebrants");g.style.opacity="0";
  setTimeout(function(){buildSlide(slides[cur]);g.style.opacity="1";uDots();uCounter();},380);
}
function uDots(){document.querySelectorAll(".slide-dot").forEach(function(d,i){d.classList.toggle("active",i===cur);});}
function uCounter(){const el=document.getElementById("slide-counter");el.textContent=slides.length>1?(cur+1)+" / "+slides.length:"";}
function cycle(){if(timer)clearInterval(timer);if(slides.length<=1)return;timer=setInterval(function(){goTo(cur+1);},SLIDE_MS);}

const badge=document.getElementById("badge");badge.style.display="inline-block";
if(celebrants.length===0){
  badge.textContent="No birthdays today";badge.style.background="rgba(26,74,46,.18)";badge.style.color="#1a4a2e";
  document.getElementById("celebrants").innerHTML='<div class="no-bday">No birthdays today — check back tomorrow!</div>';
}else{
  badge.textContent=celebrants.length===1?"1 celebrant today ":celebrants.length+" celebrants today ";
  slides=[];for(let i=0;i<celebrants.length;i+=PER_SLIDE)slides.push(celebrants.slice(i,i+PER_SLIDE));
  const de=document.getElementById("dots");de.innerHTML="";
  if(slides.length>1){slides.forEach(function(_,i){const d=document.createElement("span");d.className="slide-dot";(function(x){d.onclick=function(){goTo(x);};})(i);de.appendChild(d);});}
  cur=0;buildSlide(slides[0]);uDots();uCounter();cycle();
}
(function(){const ph=new Date(new Date().getTime()+8*60*60000);const t=new Date(ph);t.setHours(8,30,0,0);if(ph>=t)t.setDate(t.getDate()+1);setTimeout(function(){location.reload();},t-ph);})();
