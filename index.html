<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Birthday Display</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#120a1f;}

.screen{
  width:100vw;height:100vh;
  background:radial-gradient(ellipse at 80% 0%,#3b1f5c 0%,transparent 55%),
             linear-gradient(170deg,#1a0e2e 0%,#241238 45%,#2b1340 75%,#160b24 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

/* Moon */
.moon{
  position:absolute;top:30px;right:110px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff6d6 0%,#ffe08a 55%,#f0b94a 100%);
  box-shadow:0 0 60px 20px rgba(255,200,90,.35),0 0 160px 60px rgba(255,150,40,.18);
  z-index:1;pointer-events:none;
}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(200,140,40,.25);}
.moon::before{width:46px;height:46px;top:48px;left:40px;}
.moon::after{width:28px;height:28px;top:118px;left:110px;}

/* Fog */
.fog{position:absolute;left:-10%;width:120%;height:220px;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,rgba(180,150,220,.18) 0%,transparent 70%);}
.fog1{bottom:-40px;animation:drift 18s ease-in-out infinite alternate;}
.fog2{bottom:40px;opacity:.7;animation:drift 25s ease-in-out infinite alternate-reverse;}
@keyframes drift{from{transform:translateX(-4%);}to{transform:translateX(4%);}}

/* Cobwebs */
.web{position:absolute;top:0;width:260px;height:260px;z-index:2;pointer-events:none;opacity:.55;}
.web.left{left:0;}
.web.right{right:0;transform:scaleX(-1);}

/* Floating layers */
#ghost-layer,#ember-layer,#bat-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
#ghost-layer{z-index:1;}
#ember-layer{z-index:2;}
#bat-layer{z-index:2;}

.ghost{position:absolute;bottom:-120px;opacity:.5;filter:drop-shadow(0 0 14px rgba(220,200,255,.7));animation:floatUp linear infinite;}
@keyframes floatUp{
  0%{transform:translateY(0) translateX(0) rotate(-6deg);}
  50%{transform:translateY(-70vh) translateX(30px) rotate(6deg);}
  100%{transform:translateY(-140vh) translateX(-20px) rotate(-6deg);}
}

.ember{position:absolute;border-radius:50%;opacity:.9;animation:emberFall linear infinite;}
@keyframes emberFall{
  from{transform:translateY(-60px) translateX(0);}
  to{transform:translateY(115vh) translateX(40px);}
}

.bat{position:absolute;left:-80px;animation:batFly linear infinite;filter:drop-shadow(0 0 6px rgba(0,0,0,.6));}
@keyframes batFly{
  0%{transform:translateX(0) translateY(0) scaleX(1);}
  25%{transform:translateX(30vw) translateY(-30px);}
  50%{transform:translateX(60vw) translateY(20px);}
  75%{transform:translateX(90vw) translateY(-25px);}
  100%{transform:translateX(125vw) translateY(10px);}
}
.bat span{display:inline-block;animation:flap .35s ease-in-out infinite alternate;}
@keyframes flap{from{transform:scaleY(1) rotate(-6deg);}to{transform:scaleY(.7) rotate(6deg);}}

/* Pumpkins */
.pumpkins{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;padding:0 120px;z-index:3;pointer-events:none;align-items:flex-end;}
.pumpkin{font-size:110px;line-height:1;filter:drop-shadow(0 0 22px rgba(255,140,0,.75));animation:flicker 3s ease-in-out infinite;}
.pumpkin.small{font-size:70px;animation-delay:-1.4s;}
@keyframes flicker{0%,100%{filter:drop-shadow(0 0 22px rgba(255,140,0,.75));}
  45%{filter:drop-shadow(0 0 32px rgba(255,170,30,.95));}
  60%{filter:drop-shadow(0 0 16px rgba(255,120,0,.55));}}
.pgroup{display:flex;align-items:flex-end;gap:6px;}

/* Main layout */
.main{position:relative;z-index:4;display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;}

.hb-title{
  font-family:"Creepster",cursive;
  font-size:clamp(4.5rem,10vw,9rem);
  color:#ff8a1f;
  line-height:1;letter-spacing:.04em;
  text-shadow:0 0 12px rgba(255,138,31,.7),0 0 40px rgba(255,100,0,.45),3px 4px 0 #3a0f5c;
  margin-bottom:.4rem;
  animation:glow 3.5s ease-in-out infinite alternate;
}
@keyframes glow{from{text-shadow:0 0 10px rgba(255,138,31,.55),0 0 30px rgba(255,100,0,.3),3px 4px 0 #3a0f5c;}
  to{text-shadow:0 0 18px rgba(255,160,50,.9),0 0 55px rgba(255,100,0,.6),3px 4px 0 #3a0f5c;}}

.date-label{
  font-family:"Montserrat",sans-serif;font-size:1.5rem;font-weight:600;
  color:#c9a8ff;letter-spacing:.2em;text-transform:uppercase;margin-bottom:.5rem;
}

.badge{
  display:inline-block;margin-bottom:.7rem;
  background:#ff8a1f;color:#1a0e2e;
  font-family:"Montserrat",sans-serif;font-size:.9rem;font-weight:700;
  padding:.35rem 1.3rem;border-radius:999px;
  box-shadow:0 0 18px rgba(255,138,31,.5);
}

/* Celebrants */
.celebrants{display:flex;flex-direction:row;justify-content:center;align-items:flex-start;width:75%;gap:0;transition:opacity .4s ease;}
.celebrants.solo{width:100%;}
.person{display:flex;flex-direction:column;align-items:center;gap:.8rem;animation:popin .5s ease both;width:50%;}
.celebrants.solo .person{width:auto;}
@keyframes popin{0%{transform:scale(.75);opacity:0;}80%{transform:scale(1.04);}100%{transform:scale(1);opacity:1;}}

/* Glowing orange ring */
.avatar-wrap{
  width:420px;height:420px;border-radius:50%;padding:8px;
  background:conic-gradient(#ff8a1f,#8a3cff,#ff8a1f,#ffb347,#8a3cff,#ff8a1f);
  box-shadow:0 0 40px rgba(255,138,31,.55),0 0 90px rgba(138,60,255,.35);
  flex-shrink:0;
  animation:ringPulse 4s ease-in-out infinite;
}
@keyframes ringPulse{0%,100%{box-shadow:0 0 30px rgba(255,138,31,.45),0 0 70px rgba(138,60,255,.3);}
  50%{box-shadow:0 0 55px rgba(255,138,31,.75),0 0 110px rgba(138,60,255,.5);}}
.avatar{
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  background:linear-gradient(135deg,#4b1f7a,#1a0e2e);
  display:flex;align-items:center;justify-content:center;
  font-family:"Creepster",cursive;color:#ffb347;font-size:7rem;
}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}

.pname{
  font-family:"Montserrat",sans-serif;font-weight:700;
  font-size:2.6rem;color:#fff1dc;text-shadow:0 0 14px rgba(255,138,31,.55);
  text-align:center;line-height:1.2;max-width:440px;
}

/* Logo */
.logo-area{position:absolute;bottom:.8rem;left:50%;transform:translateX(-50%);z-index:5;background:transparent;}
.logo-area img{height:55px;width:auto;display:block;filter:brightness(1.8) drop-shadow(0 0 8px rgba(255,255,255,.35));}

/* Slide nav */
.dots{position:absolute;bottom:.3rem;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:8px;}
.slide-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:rgba(255,200,140,.3);transition:all .3s ease;cursor:pointer;}
.slide-dot.active{background:#ff8a1f;transform:scale(1.35);}
.slide-counter{position:absolute;top:1rem;right:1.5rem;z-index:6;color:rgba(255,220,180,.5);font-size:.8rem;font-family:"Montserrat",sans-serif;}
.no-bday{color:#fff1dc;font-size:1.5rem;font-family:"Montserrat",sans-serif;text-shadow:0 0 14px rgba(255,138,31,.5);}
</style>
</head>

const PER_SLIDE=2,SLIDE_MS=6000;
const now=new Date(),todayM=now.getMonth()+1,todayD=now.getDate();
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
document.getElementById("date-label").textContent=MONTHS[now.getMonth()]+" "+todayD+", "+now.getFullYear();

/* FLOATING GHOSTS */
const ghostLayer=document.getElementById("ghost-layer");
for(let i=0;i<10;i++){
  const g=document.createElement("div");g.className="ghost";g.textContent="👻";
  g.style.fontSize=(36+Math.random()*50)+"px";
  g.style.left=(Math.random()*95)+"vw";
  g.style.animationDuration=(16+Math.random()*14)+"s";
  g.style.animationDelay=(-Math.random()*30)+"s";
  ghostLayer.appendChild(g);
}

/* GLOWING EMBERS (replaces confetti) */
const emberLayer=document.getElementById("ember-layer");
const emberColors=["#ff8a1f","#ffb347","#ffd27a","#b57cff"];
for(let i=0;i<70;i++){
  const e=document.createElement("div");e.className="ember";
  const s=3+Math.random()*6;
  e.style.width=e.style.height=s+"px";
  e.style.left=(Math.random()*100)+"vw";
  e.style.top=(-Math.random()*100)+"px";
  const c=emberColors[Math.floor(Math.random()*emberColors.length)];
  e.style.background=c;e.style.boxShadow="0 0 "+(s*2)+"px "+c;
  e.style.animationDuration=(8+Math.random()*10)+"s";
  e.style.animationDelay=(-Math.random()*18)+"s";
  emberLayer.appendChild(e);
}

/* BATS */

for(let i=0;i<6;i++){
  const b=document.createElement("div");b.className="bat";
  b.innerHTML="<span>🦇</span>";
  b.style.fontSize=(24+Math.random()*26)+"px";
  b.style.top=(5+Math.random()*45)+"vh";
  b.style.animationDuration=(14+Math.random()*14)+"s";
  b.style.animationDelay=(-Math.random()*25)+"s";
  batLayer.appendChild(b);
}

const celebrants=EMPLOYEES.filter(e=>e.month===todayM&&e.day===todayD);
function initials(n){return n.split(" ").map(w=>w[0]||"").slice(0,2).join("").toUpperCase();}

function makePerson(person){
  const wrap=document.createElement("div");wrap.className="person";
  const aw=document.createElement("div");aw.className="avatar-wrap";
  const av=document.createElement("div");av.className="avatar";
  if(person.photo&&person.photo.startsWith("http")){
    const img=document.createElement("img");img.src=person.photo;
    img.onerror=function(){av.textContent=initials(person.name);};
    av.appendChild(img);
  }else{av.textContent=initials(person.name);}
  aw.appendChild(av);wrap.appendChild(aw);
  const nm=document.createElement("div");nm.className="pname";nm.textContent=person.name;wrap.appendChild(nm);
  return wrap;
}

function buildSlide(persons){
  const g=document.getElementById("celebrants");g.innerHTML="";
  g.className=persons.length===1?"celebrants solo":"celebrants";
  persons.forEach(function(p,i){const el=makePerson(p);el.style.animationDelay=(i*.15).toFixed(2)+"s";g.appendChild(el);});
}

let timer=null,cur=0,slides=[];
function goTo(idx){
  cur=(idx+slides.length)%slides.length;
  const g=document.getElementById("celebrants");g.style.opacity="0";
  setTimeout(function(){buildSlide(slides[cur]);g.style.opacity="1";uDots();uCounter();},380);
}
function uDots(){document.querySelectorAll(".slide-dot").forEach(function(d,i){d.classList.toggle("active",i===cur);});}
function uCounter(){const el=document.getElementById("slide-counter");el.textContent=slides.length>1?(cur+1)+" / "+slides.length:"";}
function cycle(){if(timer)clearInterval(timer);if(slides.length<=1)return;timer=setInterval(function(){goTo(cur+1);},SLIDE_MS);}

const badge=document.getElementById("badge");badge.style.display="inline-block";
if(celebrants.length===0){
  badge.textContent="No birthdays today";badge.style.background="rgba(255,200,140,.18)";badge.style.color="#ffd9a8";badge.style.boxShadow="none";
  document.getElementById("celebrants").innerHTML='<div class="no-bday">No birthdays today — check back tomorrow! 👻</div>';
}else{
  badge.textContent=celebrants.length===1?"1 celebrant today ":celebrants.length+" celebrants today ";
  slides=[];for(let i=0;i<celebrants.length;i+=PER_SLIDE)slides.push(celebrants.slice(i,i+PER_SLIDE));
  const de=document.getElementById("dots");de.innerHTML="";
  if(slides.length>1){slides.forEach(function(_,i){const d=document.createElement("span");d.className="slide-dot";(function(x){d.onclick=function(){goTo(x);};})(i);de.appendChild(d);});}
  cur=0;buildSlide(slides[0]);uDots();uCounter();cycle();
}
(function(){const ph=new Date(new Date().getTime()+8*60*60000);const t=new Date(ph);t.setHours(8,30,0,0);if(ph>=t)t.setDate(t.getDate()+1);setTimeout(function(){location.reload();},t-ph);})();
